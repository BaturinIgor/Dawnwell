name: Dawnwell
options:
  bundleIdPrefix: com.dawnwell
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Dawnwell:
    type: application
    platform: iOS
    sources:
      - Dawnwell
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dawnwell.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dawnwell
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
  DawnwellTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - DawnwellTests
    dependencies:
      - target: Dawnwell
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.dawnwell.app.tests
schemes:
  Dawnwell:
    build:
      targets:
        Dawnwell: all
        DawnwellTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - DawnwellTests
