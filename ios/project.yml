name: Dawnwell
options:
  bundleIdPrefix: com.dawnwell
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Dawnwell:
    type: application
    platform: iOS
    sources:
      - Dawnwell
      - Shared
    dependencies:
      - target: DawnwellWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dawnwell.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dawnwell
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Dawnwell reads your weight from Apple Health so you don't have to type it twice. It never shares it."
        CODE_SIGN_ENTITLEMENTS: Dawnwell/Dawnwell.entitlements
  DawnwellWidgets:
    type: app-extension
    platform: iOS
    sources:
      - DawnwellWidgets
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dawnwell.app.widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: DawnwellWidgets/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Dawnwell
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  DawnwellTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - DawnwellTests
    dependencies:
      - target: Dawnwell
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.dawnwell.app.tests
schemes:
  Dawnwell:
    build:
      targets:
        Dawnwell: all
        DawnwellTests: [test]
    run:
      storeKitConfiguration: StoreKit/Dawnwell.storekit
    test:
      gatherCoverageData: true
      targets:
        - DawnwellTests
