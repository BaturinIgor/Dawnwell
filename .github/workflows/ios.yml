name: iOS

on:
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode
        run: xcodebuild -version
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((k for k in devices if ".iOS-" in k), key=lambda k: [int(p) for p in k.rsplit(".iOS-", 1)[1].split("-")])
          for rt in reversed(runtimes):
              phones = [d for d in devices[rt] if d["name"].startswith("iPhone")]
              if phones:
                  print(phones[-1]["udid"]); break
          ')
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Dawnwell.xcodeproj \
            -scheme Dawnwell \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log | grep -E "error:|warning: .*Dawnwell|Test Case .* (passed|failed)|Executed|TEST (SUCCEEDED|FAILED)|BUILD (SUCCEEDED|FAILED)" || (tail -200 xcodebuild.log; exit 1)
      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            ios/TestResults.xcresult
            ios/xcodebuild.log
