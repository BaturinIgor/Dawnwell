name: iOS

on:
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast check on Linux: every language has every string, and the generated files are current.
  strings:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Translations are complete
        run: python3 scripts/localize.py --check
      - name: Every string in the code has a translation
        run: python3 scripts/extract_strings.py --check
      - name: App Store texts fit Apple's limits
        run: python3 scripts/appstore.py --check

  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Use Xcode 26 or later
        run: |
          # The App Store accepts only builds made with the iOS 26 SDK or later.
          X=$(ls -d /Applications/Xcode_*.app | grep -E '/Xcode_(2[6-9]|[3-9][0-9])[0-9.]*\.app$' | sort -V | tail -1)
          [ -n "$X" ] || { ls -d /Applications/Xcode*.app; echo "::error::No Xcode 26 or later on this runner"; exit 1; }
          sudo xcode-select -s "$X"
          xcodebuild -version
      - name: Show Xcode
        run: xcodebuild -version
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((k for k in devices if ".iOS-" in k), key=lambda k: [int(p) for p in k.rsplit(".iOS-", 1)[1].split("-")])
          for rt in reversed(runtimes):
              phones = [d for d in devices[rt] if d["name"].startswith("iPhone")]
              if phones:
                  print(phones[-1]["udid"]); break
          ')
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Dawnwell.xcodeproj \
            -scheme Dawnwell \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log | grep -E "error:|warning: .*Dawnwell|Test Case .* (passed|failed)|Executed|TEST (SUCCEEDED|FAILED)|BUILD (SUCCEEDED|FAILED)" || (tail -200 xcodebuild.log; exit 1)
      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            ios/TestResults.xcresult
            ios/xcodebuild.log
