name: Next release

# Sends the version in ios/AppStore/whats-new.json to App Review by itself once the version before it is out:
# every hour it checks (release.py ready), and when every other version is on the App Store and a processed
# build exists, it makes the version, fills its texts and screenshots in every language, and submits it.
# Otherwise it does nothing. Once submitted, later checks see the version in review and stop.
# Run it by hand too: Actions -> Next release -> Run workflow.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: next-release
  cancel-in-progress: false

jobs:
  ready:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pyjwt cryptography requests
      - id: check
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: python3 ios/scripts/release.py ready

  prepare:
    needs: ready
    if: needs.ready.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pyjwt cryptography requests
      - name: Make the version, What's New, newest build
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: python3 ios/scripts/release.py prepare

  listing:
    needs: prepare
    uses: ./.github/workflows/appstore.yml
    with:
      parts: texts,screenshots
    secrets: inherit

  submit:
    needs: listing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pyjwt cryptography requests
      - name: Send to App Review
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: python3 ios/scripts/release.py submit
